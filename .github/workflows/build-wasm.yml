name: Build RubberBand WASM

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Emscripten SDK
        run: |
          git clone https://github.com/emscripten-core/emsdk.git
          cd emsdk
          ./emsdk install latest
          ./emsdk activate latest
          source ./emsdk_env.sh
          cd ..

      - name: Prepare includes & file list
        run: |
          # link sysutils.h into a 'system' folder so includes of "system/sysutils.h" work
          mkdir -p src/common/system
          ln -sf ../sysutils.h src/common/system/sysutils.h

          # list all .cpp except Thread/Resampler/Profiler
          find src -name '*.cpp' \
            ! -name 'Thread.cpp' \
            ! -name 'Resampler.cpp' \
            ! -name 'Profiler.cpp' \
            > files.txt

      - name: Build with emcc
        run: |
          source emsdk/emsdk_env.sh

          ./emsdk/upstream/emscripten/emcc \
            -O3 \
            -std=c++17 \
            -Isrc \
            -Isrc/common \
            -Isrc/common/system \
            @files.txt \
            -DRB_USE_STUB_THREAD=1 \
            -s ALLOW_MEMORY_GROWTH=1 \
            -s INITIAL_MEMORY=134217728 \
            -s MODULARIZE=1 \
            -s EXPORT_NAME="RubberBandModule" \
            -s ENVIRONMENT="web" \
            -s EXPORTED_FUNCTIONS="['_rubberband_new','_rubberband_delete','_rubberband_process']" \
            -o rubberband.js

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rubberband-wasm
          path: |
            rubberband.js
            rubberband.wasm
