name: Build RubberBand WASM

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Emscripten SDK
      run: |
        git clone https://github.com/emscripten-core/emsdk.git
        cd emsdk
        ./emsdk install latest
        ./emsdk activate latest
        source ./emsdk_env.sh
        cd ..

    - name: Build RubberBand WASM
      run: |
        find src -name '*.cpp' > files.txt
        ./emsdk/upstream/emscripten/emcc \
          -O3 \
          -std=c++17 \
          -I src \
          @files.txt \
          -DRB_USE_STUB_THREAD=1 \
          -s ALLOW_MEMORY_GROWTH=1 \
          -s INITIAL_MEMORY=134217728 \
          -s MODULARIZE=1 \
          -s EXPORT_NAME="RubberBandModule" \
          -s ENVIRONMENT="web" \
          -s EXPORTED_FUNCTIONS="['_rubberband_new','_rubberband_set_expected_input_duration','_rubberband_set_max_process_size','_rubberband_study','_rubberband_process','_rubberband_get_samples_required','_rubberband_retrieve','_rubberband_delete']" \
          -o rubberband.js

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: rubberband-wasm
        path: |
          rubberband.js
          rubberband.wasm
