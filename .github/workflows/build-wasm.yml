name: Build RubberBand WASM


on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Emscripten SDK
        run: |
          git clone https://github.com/emscripten-core/emsdk.git
          cd emsdk
          ./emsdk install latest
          ./emsdk activate latest
          source ./emsdk_env.sh
          cd ..

      - name: Build with emcc
        run: |
          # Emscripten 環境の読み込み
          source emsdk/emsdk_env.sh

          # Thread.cpp を除外（stub-thread で対応）
          find src -name '*.cpp' ! -name 'Thread.cpp' > files.txt

          # コンパイル。線形リサンプラーを選択
          ./emsdk/upstream/emscripten/emcc \
            -O3 \
            -std=c++17 \
            -I src \
            @files.txt \
            -DRB_USE_STUB_THREAD=1 \
            -DRB_USE_LINEAR_RESAMPLER=1 \
            -s ALLOW_MEMORY_GROWTH=1 \
            -s INITIAL_MEMORY=134217728 \
            -s MODULARIZE=1 \
            -s EXPORT_NAME="RubberBandModule" \
            -s ENVIRONMENT="web" \
            -s EXPORTED_FUNCTIONS="['_rubberband_new','_rubberband_delete','_rubberband_process']" \
            -o rubberband.js

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rubberband-wasm
          path: |
            rubberband.js
            rubberband.wasm
